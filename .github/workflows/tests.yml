name: Validate the app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python swarm_metrics.py
      - run: node --check static/app.js
      - run: node --check static/hosted-storage.js
      - run: node --check static/home.js
      - run: node --check static/demo.js
      - run: node --check static/demo-player.js
      - run: node --check static/graph.js
      - run: node --input-type=module --check < static/graph-space.js
